<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breadboard Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f3f1e9'/%3E%3Cg fill='%23333'%3E%3Ccircle cx='8' cy='10' r='2'/%3E%3Ccircle cx='16' cy='10' r='2'/%3E%3Ccircle cx='24' cy='10' r='2'/%3E%3Ccircle cx='8' cy='22' r='2'/%3E%3Ccircle cx='16' cy='22' r='2'/%3E%3Ccircle cx='24' cy='22' r='2'/%3E%3C/g%3E%3Crect x='4' y='14.5' width='24' height='3' fill='%23d9d5c7'/%3E%3C/svg%3E" />
    <script>
      // 首帧前写好 <html data-theme>（issue #23）：等 React 起来再切会先闪一下浅色。
      // key 与解析规则必须和 apps/web/src/theme.ts 保持一致。
      (function () {
        try {
          var pref = localStorage.getItem('breadboard-studio.v1.theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
